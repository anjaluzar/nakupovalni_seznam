sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORG
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=nakupovalni-seznam
sonar.projectVersion=1.0

# Sources and tests (client + server)
sonar.sources=client/src,server
sonar.tests=client/src,server
sonar.test.inclusions=**/*.test.*,**/*.spec.*

# Exclude build artifacts and dependencies
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.min.js

# Coverage reports generated by GitHub Actions
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
